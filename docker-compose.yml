services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: career-quest-backend:latest
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: sqlite:////app/storage/career_quest.db
      DATA_DIR: /app/data/synthetic
      LLM_API_KEY: ${LLM_API_KEY:-}
    volumes:
      - career_quest_db:/app/storage
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api
    image: career-quest-frontend:latest
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  career_quest_db:
